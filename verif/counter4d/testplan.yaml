# testplan.yaml: counter4d (SAD 3.1) · Dayo · v1.0
block: counter4d
version: "1.0"
vps_ref: spec/counter4d/vps.yaml@v0.1
risk: LOW
targets: {line: 100, branch: 100, toggle: 100, fsm: 100, functional: 100}   # riskmap.yaml
formal_harness: none        # formal_properties_required is empty
coverage_dsl: v1
clock: clk                  # 100 MHz per clocks.yaml
harnesses: [verif/test_counter4d.py]
scenarios:
  - id: VPS-01
    revision: 1
    slug: reset
    req_ids: [REQ-3.1.1]
    intent: "Count to a non-zero value with en 1, then drive rst_n to 0 at a falling edge with en 0, hold, then release."
    expected: "count is 0 after the first rising edge with rst_n 0 and stays 0 while rst_n is 0."
    covergroup: cg_vps_01
    coverpoints: {count_at: [mid, max]}
    directed: test_vps_01_reset
    properties: []
  - id: VPS-02
    revision: 1
    slug: increment
    req_ids: [REQ-3.1.2]
    intent: "After reset, drive en 1 for several edges."
    expected: "count increases by 1 at every rising edge."
    covergroup: cg_vps_02
    coverpoints: {count_at: [zero, mid]}
    directed: test_vps_02_increment
    properties: []
  - id: VPS-03
    revision: 1
    slug: hold
    req_ids: [REQ-3.1.4, REQ-3.1.5]
    intent: "At count 0, a mid value and 15, drive en 0 for many edges and toggle en between edges."
    expected: "count keeps its value while en is 0 and changes only at rising edges."
    covergroup: cg_vps_03
    coverpoints: {count_at: [zero, mid, max]}
    directed: test_vps_03_hold
    properties: []
  - id: VPS-04
    revision: 1
    slug: wrap
    req_ids: [REQ-3.1.3]
    intent: "Count up to 15 and give one more enabled edge."
    expected: "count goes from 15 to 0."
    covergroup: cg_vps_04
    coverpoints: {count_at: [max]}
    directed: test_vps_04_wrap
    properties: []
  - id: VPS-05
    revision: 1
    slug: reset_priority
    req_ids: [REQ-3.1.1]
    intent: "Drive rst_n 0 and en 1 together at a falling edge, at a non-zero count."
    expected: "count becomes 0 and stays 0 while rst_n is 0 despite en 1."
    covergroup: cg_vps_05
    coverpoints: {count_at: [mid]}
    directed: test_vps_05_reset_priority
    properties: []
  - id: VPS-06
    revision: 1
    slug: port_list
    req_ids: [REQ-3.1.6]
    intent: "Inspect the port list (clk, rst_n, en, count[3:0], no parameters); the harness reads count as 4 bits through a scenario."
    expected: "Ports are exactly clk, rst_n, en, count[3:0]."
    covergroup: cg_vps_06
    coverpoints: {count_at: [zero]}
    directed: test_vps_06_port_list
    properties: []
extra_tests: [test_random_seeded]
constraint_model:
  IDD-COUNTER_IO:
    en: "0 or 1, 3 edges in 4 at 1; changes at falling edges only (R1)"
    rst_n: "1 except about 1 edge in 20 at 0, with en random (VPS-05); changes at falling edges only (R1)"
  illegal_inputs_excluded: ["en or rst_n changing in the same timestep as a rising edge of clk (R1)"]
