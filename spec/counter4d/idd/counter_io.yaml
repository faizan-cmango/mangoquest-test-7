idd: IDD-COUNTER_IO
version: "0.1"
block: counter4d
side: slave
protocol_class: level
sad_section: "3.1"
clock: clk
reset: rst_n
ports:
  - {name: clk, dir: in, width: 1, type: logic, req: REQ-3.1.5, reset_value: n/a, meaning: "100 MHz clock; all behaviour on its rising edge"}
  - {name: rst_n, dir: in, width: 1, type: logic, req: REQ-3.1.1, reset_value: n/a, meaning: "Synchronous reset, active low"}
  - {name: en, dir: in, width: 1, type: logic, req: REQ-3.1.2, reset_value: n/a, meaning: "Count enable: 1 increments, 0 holds"}
  - {name: count, dir: out, width: 4, type: logic, req: REQ-3.1.2, reset_value: 0, meaning: "Counter value 0..15, wraps from 15 to 0"}
omitted_signals: []
rules:
  - {id: R1, holder: environment, req: REQ-3.1.5, text: "Inputs en and rst_n never change in the same timestep as a rising edge of clk; they change at falling edges only."}
  - {id: R2, holder: block, req: REQ-3.1.1, text: "rst_n at 0 has priority over en."}
timing:
  - {req: REQ-3.1.1, clock: clk, from: "rising edge of clk with rst_n 0", to: "count is 0", cycles: 0, text: "count is 0 right after the edge (changes only at that edge)"}
  - {req: REQ-3.1.2, clock: clk, from: "rising edge of clk with rst_n 1 and en 1", to: "count incremented", cycles: 0, text: "count is the previous value plus 1 right after the edge"}
corner_cases:
  - {id: C1, req: REQ-3.1.3, text: "count 15 with en 1 wraps to 0", vps: VPS-04}
  - {id: C2, req: REQ-3.1.1, text: "rst_n 0 with en 1 gives count 0", vps: VPS-05}
  - {id: C3, req: REQ-3.1.4, text: "en 0 holds count at every value", vps: VPS-03}
registers: []
errata_applied: []
